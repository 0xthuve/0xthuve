name: Generate Snake (No Commit Spam)

on:
  schedule:
    - cron: "0 0 * * *"   # daily (optional)
  workflow_dispatch:       # manual run

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo (read-only)
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Generate snake SVGs into /dist
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: thuver104
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=blue
            dist/github-snake-dark.svg?palette=github-dark&color_snake=green

      # 3. Upload as GitHub Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
